<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten-Go kaizu</title>
<link rel="icon" type="image/png" href="/logo.png">
<!-- Ten-Go's sea chart (海図), served by `ten-go --kaizu` (kit/tengo_kaizu.py): a campaign drawn as the pieces of a torrent -->
<style>
:root {   /* --calc-<machine>: what a machine is computing, a sharp shade of its colour (a machine without one: its colour); --held: the opacity of what it holds */
  --bg: #f7f6f2; --card: #ffffff; --fg: #1c232b; --muted: #66707c; --line: #e2dfd6; --free: #d5d8dc; --late: #d98a1c;
  --hi: #d1495b; --lo: #6f86a0; --skip: #9aa1a9; --sel: rgba(255, 190, 0, .38); --tick: #c0392b; --ok: #2e7d4f; --err: #b3261e;
  --calc-azag: #0091ea; --calc-yzao: #00c853; --held: .33; --now: #a4167a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --card: #1b1f25; --fg: #e4e7ea; --muted: #98a2ad; --line: #2b3038; --free: #3b414a; --late: #e6a23c;
    --hi: #ef6f7f; --lo: #8fa6c0; --skip: #6c737b; --sel: rgba(255, 200, 40, .30); --tick: #ff7b6b; --ok: #5cc28a; --err: #ff8a80;
    --calc-azag: #4fb3ff; --calc-yzao: #3ddc84; --held: .45; --now: #f06bc8;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --card: #1b1f25; --fg: #e4e7ea; --muted: #98a2ad; --line: #2b3038; --free: #3b414a; --late: #e6a23c;
  --hi: #ef6f7f; --lo: #8fa6c0; --skip: #6c737b; --sel: rgba(255, 200, 40, .30); --tick: #ff7b6b; --ok: #5cc28a; --err: #ff8a80;
  --calc-azag: #4fb3ff; --calc-yzao: #3ddc84; --held: .45; --now: #f06bc8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; gap: 14px; align-items: center; padding: 12px 16px 6px; }
#logo { position: relative; flex: none; width: 33px; height: 33px; }   /* the logo small, at 200 px under the pointer */
#logo img { display: block; width: 33px; height: 33px; }
#logo img.big { display: none; position: absolute; left: 0; top: 0; width: 200px; height: 200px; z-index: 10; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); }
#logo:hover img.big { display: block; }
.htext { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; min-width: 0; }
.af { font: 11.5px ui-monospace, "DejaVu Sans Mono", Menlo, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 5px; white-space: nowrap; }
.af:empty { display: none; }
h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .01em; }
h1 .jp { font-weight: 500; color: var(--muted); margin-left: 6px; }
h2 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
main { padding: 0 16px 24px; display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
button, select, input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
#tassei.ready { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.btns { display: inline-flex; gap: 6px; white-space: nowrap; }   /* fetch and tassei wrap together */
input[type=number] { width: 64px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--fg); color: var(--bg); }
#bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--free); margin: 8px 0 6px; }
#bar div { height: 100%; }
#mapbox { position: relative; margin-top: 10px; user-select: none; }
canvas { display: block; touch-action: none; cursor: crosshair; }
#tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 340px; display: none; z-index: 2; white-space: nowrap; }
#selbar { margin-top: 10px; padding: 8px 10px; border: 1px dashed var(--muted); border-radius: 8px; display: none; }
.lv { border-radius: 999px; padding: 1px 9px; font-size: 12.5px; border: 1px solid var(--line); }
.lv.now { color: var(--now); border-color: var(--now); font-weight: 650; }
.lv.high { color: var(--hi); border-color: var(--hi); } .lv.low { color: var(--lo); border-color: var(--lo); }
.lv.skip { color: var(--skip); border-color: var(--skip); text-decoration: line-through; } .lv.normal { color: var(--muted); }
button.lvb.now { color: var(--now); font-weight: 650; } button.lvb.high { color: var(--hi); } button.lvb.low { color: var(--lo); } button.lvb.skip { color: var(--skip); }
#selbar .ids { color: var(--muted); font-size: 12.5px; }
#selbar input { width: 130px; }
tr.sub td:first-child { cursor: pointer; font-weight: 600; padding-left: 16px; white-space: nowrap; }
.tscroll { overflow-x: auto; }
@media (max-width: 600px) { .about { max-width: 150px; } }
tr.sub td:first-child::before { content: "↳ "; color: var(--muted); font-weight: 400; }
tr.sub.on td { background: var(--sel); }
.flag { border-radius: 4px; padding: 0 5px; font-size: 11.5px; border: 1px solid var(--line); margin-left: 4px; }
.flag.now { color: var(--now); border-color: var(--now); } .flag.high { color: var(--hi); border-color: var(--hi); }
#legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
#legend i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
@media (max-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr); } }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
td.r, th.r { text-align: right; }
.pbar { display: flex; height: 8px; width: 120px; border-radius: 3px; overflow: hidden; background: var(--free); }
.pbar div { height: 100%; }
.about { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12.5px; }
tr.part td:first-child { cursor: pointer; font-weight: 600; }
tr.part.on td { background: var(--sel); }
.mach { border-top: 1px solid var(--line); padding: 9px 0; }
.mach:first-of-type { border-top: 0; padding-top: 0; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.alloc { font-size: 12.5px; margin: 3px 0 0 17px; }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 8px;
  font-size: 13px; max-width: 520px; display: none; z-index: 5; }
#toast.err { background: var(--err); color: #fff; }
.rule { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rule .x { margin-left: auto; padding: 0 7px; }
.warn { color: var(--err); }
</style>
</head>
<body>
<header>
  <span id="logo"><img src="/logo.png" alt="Ten-Go, 天號作戰" onerror="this.parentNode.remove()"><img class="big" src="/logo.png" alt=""></span>
  <div class="htext">
    <h1>Ten-Go<span class="jp">海図 kaizu</span></h1>
    <select id="camp" title="campaign"></select>
    <span id="pool" class="muted num"></span>
    <span id="fetch" class="muted"></span>
    <span class="btns"><button id="sync" title="fetch the pool now">⟳ fetch</button>
    <button id="tassei" title="tassei (達成): push to the pool now the pumps this machine has done (their files, the job times, the kernel-hours), as its watch does within the minute a pump completes (ten-go --tassei): they turn from held, 'done here, not pushed yet', to done, for the other machines too">⇪ tassei</button></span>
  </div>
</header>
<main>
  <section class="card">
    <div id="sum" class="num"></div>
    <div id="bar"></div>
    <div class="row" style="margin-top:8px">
      <span class="seg" id="order"><button data-v="campaign" title="the parts in their order, each in the global order: the order of the claims">campaign order</button><button data-v="g" title="the pumps sorted by g">by g</button></span>
      <label class="muted">row = <select id="rowh"><option value="0">auto</option><option value="1">1 h</option><option value="2">2 h</option><option value="4">4 h</option><option value="8">8 h</option><option value="16">16 h</option></select> <span id="rowof"></span></label>
      <label class="muted">part <select id="part"><option value="">all</option></select></label>
      <label class="muted">next claim of <select id="nextm"><option value="">none</option></select> in <input id="h" type="number" min="0.1" step="0.5" value="2"> h</label>
      <span id="nextinfo" class="muted num"></span>
    </div>
    <div id="mapbox"><canvas id="map"></canvas><div id="tip"></div></div>
    <div id="selbar"></div>
    <div id="legend"></div>
  </section>
  <div class="cols">
    <section class="card">
      <h2>Parts</h2>
      <div class="tscroll"><table id="parts"></table></div>
    </section>
    <div style="display:grid;gap:14px">
      <section class="card">
        <h2>Priorities <span class="muted" style="font-weight:400">· the last rule that matches a pump decides; none: normal</span></h2>
        <div id="rules"></div>
      </section>
      <section class="card">
        <h2>Machines</h2>
        <div id="machines"></div>
      </section>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
"use strict";
const TOKEN = "%%TOKEN%%";
const BOOT = "%%BOOT%%";   // this run of the kaizu: another one in /state, a new kaizu took the port, and the page reloads into it
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const PALETTE = ["#1f5fa8", "#1b9e77", "#8a55c4", "#c2571a", "#a07d00", "#c2185b"];
const RH = 16, GAP = 9, TOP = 16, GUT = 62;                 // row height, gap, top margin, left gutter (px)
const PREF = (() => { try { return JSON.parse(localStorage.getItem("kaizu") || "{}"); } catch (e) { return {}; } })();
const P = Object.assign({order: "campaign", rowh: 0, part: "", nextm: "", h: 2, c: ""}, PREF);
const save = () => { try { localStorage.setItem("kaizu", JSON.stringify(P)); } catch (e) {} };
let S = null, view = [], segs = [], rows = 0, drag = null, selPids = null, spanSel = false, colour = {}, calc = {}, HA = .33, nextSet = new Set(), busy = false;
let SUB = {};   // the sub-campaigns (the rules with a name): name -> the set of their pumps
const hm = s => { const m = Math.round(s / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h` + (m % 60 ? ` ${String(m % 60).padStart(2, "0")}` : ""); };
const label = p => `${S.parts[p[F.part]].prefix} #${p[F.id] - S.parts[p[F.part]].base}`;   // hpT #1951: the part and the pump's number in it
const AF = {};   // the Anno Fabri tags of the moments shown, epoch -> tag (null where there is none), given by the kaizu (~/bin/AF)

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const kh = s => (s / 3600).toFixed(1);
const khs = s => { const x = s / 3600; return x >= 100 ? x.toFixed(0) : x.toFixed(1); };
const af = t => { const k = Math.round(t); return `<span class="af" data-t="${k}" title="its Anno Fabri tag">${AF[k] || ""}</span>`; };   // filled by tags()
const day = t => new Date(t * 1000).toLocaleString("en-GB", {weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"}) + af(t);
const ago = t => { const d = Math.max(0, Date.now() / 1000 - t); return (d < 90 ? `${Math.round(d)} s ago` : d < 5400 ? `${Math.round(d / 60)} min ago` : `${(d / 3600).toFixed(1)} h ago`) + af(t); };
// a pump of the state: [id, part, P, x, orders, seconds on the reference machine, status d|h|l|f, machine, allocation, level, rule, progress here]
const F = {id: 0, part: 1, P: 2, x: 3, orders: 4, s: 5, st: 6, m: 7, alloc: 8, lv: 9, rule: 10, prog: 11};
const rowh = () => {   // the hours of the reference machine a row holds: as chosen, or (auto) the fewest that keep the map within 40 rows
  if (P.rowh) return P.rowh;
  const t = view.reduce((a, p) => a + Math.max(p[F.s], 1), 0);
  return [1, 2, 4, 8, 16, 32, 64].find(h => t / (h * S.ref_kernels * 3600) <= 40) || 128;
};

function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.k); toast.k = setTimeout(() => t.style.display = "none", err ? 9000 : 4500);
}

async function load() {
  const c = P.c || "";
  try {
    const r = await fetch(`/state?c=${encodeURIComponent(c)}&h=${encodeURIComponent(P.h)}`);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (j.boot && j.boot !== BOOT) { location.reload(); return; }
    S = j; P.c = S.campaign; build();
  } catch (e) { $("#fetch").innerHTML = `<span class="warn">the kaizu does not answer (${esc(e.message)})</span>`; }
}

async function post(path, body) {
  if (busy) return; busy = true; document.body.style.cursor = "progress";
  toast(path === "/prio" || path === "/tassei" ? "pushing to the pool…" : "fetching…");
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Kaizu": TOKEN}, body: JSON.stringify(Object.assign({c: P.c}, body))});
    const j = await r.json();
    if (j.error) toast(j.error, true); else toast(j.said ? (path === "/tassei" ? `tassei: ${j.said}` : `pushed: ${j.said}`) : j.lost ? `could not fetch: ${j.lost}` : "fetched");
  } catch (e) { toast(e.message, true); }
  busy = false; document.body.style.cursor = ""; await load();
}

async function tags() {   // the AF tags of the dates on the page that are not known yet, asked of the kaizu in one go
  const want = [...new Set([...document.querySelectorAll(".af")].map(e => e.dataset.t))].filter(k => !(k in AF));
  if (!want.length) return;
  try { Object.assign(AF, await (await fetch(`/af?t=${want.join(",")}`)).json()); } catch (e) { return; }
  for (const e of document.querySelectorAll(".af")) e.textContent = AF[e.dataset.t] || "";
}

function build() {
  colour = {}; S.machines.forEach((m, i) => colour[m.name] = PALETTE[i % PALETTE.length]);
  calc = {}; S.machines.forEach(m => calc[m.name] = css(`--calc-${m.name}`) || colour[m.name]); HA = parseFloat(css("--held")) || .33;
  const pre = S.parts.map(q => q.prefix);
  SUB = {}; for (const r of S.rules) if (r.name) SUB[r.name] = new Set(r.pumps);
  if (P.part[0] === "@" && !SUB[P.part.slice(1)]) P.part = "";
  // the view: the pumps of the part (or sub-campaign, @name) chosen, in the campaign's order or by g
  view = S.pumps.filter(p => !P.part || (P.part[0] === "@" ? SUB[P.part.slice(1)].has(p[F.id]) : pre[p[F.part]] === P.part));
  if (P.order === "g") view = view.map((p, i) => [p, i]).sort((a, b) => a[0][F.x] - b[0][F.x] || a[1] - b[1]).map(a => a[0]);
  const nm = S.machines.find(m => m.name === P.nextm);
  nextSet = new Set(nm ? nm.next.pumps : []);
  header(); summary(); controls(); draw(); selbar(); legend(); parts(); rules(); machines(); tags();
}

function header() {
  $("#camp").innerHTML = S.campaigns.map(c => `<option${c === S.campaign ? " selected" : ""}>${esc(c)}</option>`).join("");
  const [h, t, subj] = S.head;
  const sj = subj || "", cut = sj.length > 70 ? sj.slice(0, 68) + "…" : sj;
  $("#pool").innerHTML = h ? `pool <b>${esc(h)}</b> <span title="${esc(sj)}">${esc(cut)}</span> · ${ago(+t)}` : "";
  $("#fetch").innerHTML = (S.lost ? `<span class="warn">could not fetch: ${esc(S.lost)}</span> · ` : "") + `fetched ${S.fetched ? ago(S.fetched) : "never"} · ${esc(S.machine)} · ten-go ${esc(S.version)}`;
  document.title = `${S.campaign} · Ten-Go kaizu`;
  const ready = S.pumps.filter(p => p[F.st] === "h" && p[F.m] === S.machine && p[F.prog] >= 1).length;   // done here, not pushed yet
  $("#tassei").textContent = ready ? `⇪ tassei (${ready})` : "⇪ tassei"; $("#tassei").classList.toggle("ready", ready > 0);
}

function summary() {
  const A = S.pumps, n = A.length, cnt = st => A.filter(p => p[F.st] === st).length;
  const sum = f => A.filter(f).reduce((a, p) => a + p[F.s], 0);
  const skipped = A.filter(p => p[F.st] !== "d" && p[F.lv] === "skip");
  const left = sum(p => p[F.st] !== "d" && p[F.lv] !== "skip");
  let pace = 0; const on = [];
  for (const m of S.machines) if (m.open.length) { pace += m.kernels * m.speed; on.push(`${m.name} ${m.kernels}`); }   // the watch keeps a driver to its machine's kernels
  const end = pace ? day(S.now + left / pace) : null;
  const urge = l => A.filter(p => p[F.st] !== "d" && p[F.lv] === l).length, un = urge("now"), uh = urge("high");
  $("#sum").innerHTML = `<b>${esc(S.campaign)}</b>: ${cnt("d")} / ${n} pumps done · ${cnt("h")} held · ${cnt("f") + cnt("l")} free`
    + (skipped.length ? ` (${skipped.length} skipped)` : "") + (un || uh ? ` · to do first: ${un ? `<span class="lv now">${un} now</span> ` : ""}${uh ? `<span class="lv high">${uh} high</span>` : ""}` : "") + ` · <b>${khs(left)} kh</b> left on ${esc(S.ref)}'s scale`
    + (end ? ` · end about <b>${end}</b> at the present pace (${on.join(" + ")} kernels)` : " · no machine holds an allocation")
    + `<div class="muted about" style="max-width:none" title="${esc(S.about)}">${esc(S.about)}</div>`;
  const tot = sum(() => true) || 1, segsB = [];
  for (const m of S.machines) segsB.push([sum(p => p[F.st] === "d" && p[F.m] === m.name), colour[m.name], 1, `done by ${m.name}`]);
  for (const m of S.machines) segsB.push([sum(p => p[F.st] === "h" && p[F.m] === m.name), colour[m.name], HA, `held by ${m.name}`]);
  segsB.push([sum(p => p[F.st] === "l"), css("--late"), .8, "past the deadline of its allocation"]);
  segsB.push([sum(p => (p[F.st] === "f") && p[F.lv] !== "skip"), css("--free"), 1, "free"]);
  segsB.push([sum(p => p[F.st] !== "d" && p[F.st] !== "h" && p[F.lv] === "skip"), css("--skip"), .45, "skipped"]);
  $("#bar").innerHTML = segsB.filter(s => s[0] > 0).map(([s, c, a, t]) => `<div title="${t}: ${khs(s)} kh" style="width:${100 * s / tot}%;background:${c};opacity:${a}"></div>`).join("");
}

function controls() {
  for (const b of document.querySelectorAll("#order button")) b.classList.toggle("on", b.dataset.v === P.order);
  $("#rowh").value = String(P.rowh);
  $("#rowof").textContent = `${P.rowh ? "" : `(${rowh()} h) `}of ${S.ref} at ${S.ref_kernels} kernels = ${(rowh() * S.ref_kernels).toFixed(0)} kh`;
  $("#part").innerHTML = `<option value="">all</option>` + S.parts.map(q => `<option${q.prefix === P.part ? " selected" : ""}>${esc(q.prefix)}</option>`).join("")
    + Object.keys(SUB).map(nm => `<option value="@${esc(nm)}"${"@" + nm === P.part ? " selected" : ""}>↳ ${esc(nm)}</option>`).join("");
  $("#nextm").innerHTML = `<option value="">none</option>` + S.machines.map(m => `<option${m.name === P.nextm ? " selected" : ""}>${esc(m.name)}</option>`).join("");
  $("#h").value = P.h;
  const nm = S.machines.find(m => m.name === P.nextm);
  if (nm) {
    const q = nm.next.pumps.map(id => S.pumps.find(p => p[F.id] === id));
    const xs = q.map(p => p[F.x]);
    $("#nextinfo").innerHTML = q.length ? `${q.length} pumps, ${kh(nm.next.cost)} kh on ${nm.next.kernels} kernels` + (xs.length ? `, ${Math.min(...xs).toFixed(3)}–${Math.max(...xs).toFixed(3)} g` : "") : "nothing free to claim";
  } else $("#nextinfo").textContent = "";
}

// ------------------------------------------------------------------------------------------------------------------------ the map
function layout(W) {
  const L = rowh() * S.ref_kernels * 3600; let t = 0; segs = [];
  view.forEach((p, k) => {
    const a = t, b = t + Math.max(p[F.s], 1); t = b;
    for (let r = Math.floor(a / L); r <= Math.floor((b - 1e-6) / L); r++) {
      const x0 = Math.max(a, r * L) - r * L, x1 = Math.min(b, (r + 1) * L) - r * L;
      if (x1 - x0 > 1e-9) segs.push({k, r, x0: GUT + W * x0 / L, x1: GUT + W * x1 / L});
    }
  });
  rows = Math.max(1, Math.ceil(t / L));
}

let hatch = null;
function pattern(ctx, c) {
  const t = document.createElement("canvas"); t.width = t.height = 6; const g = t.getContext("2d");
  g.strokeStyle = c; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 6); g.lineTo(6, 0); g.stroke(); return ctx.createPattern(t, "repeat");
}

function draw() {
  const cv = $("#map"), box = $("#mapbox"), dpr = window.devicePixelRatio || 1, W = Math.max(200, box.clientWidth - GUT - 2);
  layout(W);
  const H = TOP + rows * (RH + GAP) + 4;
  cv.width = (W + GUT + 2) * dpr; cv.height = H * dpr; cv.style.width = (W + GUT + 2) + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = css("--card"), free = css("--free"), late = css("--late"), hi = css("--hi"), lo = css("--lo"), skip = css("--skip"), tick = css("--tick"), muted = css("--muted"), nowc = css("--now");
  hatch = pattern(ctx, skip);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W + GUT + 2, H);
  const sel = selected(), y = r => TOP + r * (RH + GAP);
  ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";
  // the row labels: the hours of the reference machine from the start, or the g of the row's first pump
  const first = {}; for (const s of segs) if (!(s.r in first)) first[s.r] = s;
  ctx.fillStyle = muted;
  for (let r = 0; r < rows; r++) {
    const lab = P.order === "g" ? (first[r] ? view[first[r].k][F.x].toFixed(3) + " g" : "") : `${r * rowh()} h`;
    ctx.fillText(lab, 2, y(r) + RH / 2);
  }
  for (const s of segs) {
    const p = view[s.k], x = s.x0, w = s.x1 - s.x0, top = y(s.r), st = p[F.st], c = colour[p[F.m]] || muted;
    const gap = w > 3 ? 1 : 0;
    if (st === "d") { ctx.globalAlpha = 1; ctx.fillStyle = c; ctx.fillRect(x, top, w - gap, RH); }
    else if (st === "h") {
      ctx.globalAlpha = HA; ctx.fillStyle = c; ctx.fillRect(x, top, w - gap, RH);
      if (p[F.prog] > 0) { ctx.globalAlpha = 1; ctx.fillStyle = calc[p[F.m]] || c; ctx.fillRect(x, top, Math.max(2, (w - gap) * p[F.prog]), RH); }   // what this machine computes, so far
    } else {
      ctx.globalAlpha = 1; ctx.fillStyle = free; ctx.fillRect(x, top, w - gap, RH);
      if (st === "l") { ctx.fillStyle = late; ctx.fillRect(x, top + RH - 3, w - gap, 3); }
      if (p[F.lv] === "skip") { ctx.fillStyle = bg; ctx.globalAlpha = .55; ctx.fillRect(x, top, w - gap, RH); ctx.globalAlpha = 1; ctx.fillStyle = hatch; ctx.fillRect(x, top, w - gap, RH); }
    }
    ctx.globalAlpha = 1;
    if (st !== "d" && (p[F.lv] === "high" || p[F.lv] === "low")) { ctx.fillStyle = p[F.lv] === "high" ? hi : lo; ctx.fillRect(x, top - 4, w - gap, 3); }
    if (st !== "d" && p[F.lv] === "now") { ctx.fillStyle = nowc; ctx.fillRect(x, top - 6, w - gap, 5); }
    if (sel.has(p[F.id])) { ctx.fillStyle = css("--sel"); ctx.fillRect(x, top - 1, w - gap, RH + 2); }
  }
  // the next claim of a machine, as it would take its pumps
  if (nextSet.size) {
    ctx.strokeStyle = colour[P.nextm]; ctx.lineWidth = 1.6; ctx.setLineDash([3, 2]);
    for (const s of segs) if (nextSet.has(view[s.k][F.id])) ctx.strokeRect(s.x0 + .8, y(s.r) + .8, s.x1 - s.x0 - 2.6, RH - 1.6);
    ctx.setLineDash([]);
  }
  // where each part begins (campaign order)
  if (P.order === "campaign") {
    let last = -1, room = {}; ctx.font = "10.5px system-ui, sans-serif"; ctx.textBaseline = "alphabetic";
    for (const s of segs) {
      const q = view[s.k][F.part];
      if (q === last) continue; last = q;
      const top = y(s.r), name = S.parts[q].prefix;
      ctx.fillStyle = tick; ctx.fillRect(s.x0 - .5, top - 5, 1.6, RH + 7);
      if (s.x0 < (room[s.r] || 0)) continue;   // too close to the label before it: the tick alone (the tooltip names the part)
      ctx.lineWidth = 3; ctx.strokeStyle = bg; ctx.strokeText(name, s.x0 + 3, top - 1.5); ctx.fillText(name, s.x0 + 3, top - 1.5);
      room[s.r] = s.x0 + 6 + ctx.measureText(name).width;
    }
  }
}

function at(e) {   // the index in the view of the piece under the pointer, or -1
  const b = $("#map").getBoundingClientRect(), x = e.clientX - b.left, yy = e.clientY - b.top;
  const r = Math.floor((yy - TOP + GAP / 2) / (RH + GAP));
  for (const s of segs) if (s.r === r && x >= s.x0 && x < s.x1) return s.k;
  return -1;
}
function selected() {   // a click picks a piece or drops it (the others kept); a drag takes a span, in place of the pieces picked (Shift, Ctrl: added to them)
  if (drag) {
    if (!drag.moved) { const s = new Set(drag.base), id = view[drag.a][F.id]; if (s.has(id)) s.delete(id); else s.add(id); return s; }
    const [a, b] = [Math.min(drag.a, drag.b), Math.max(drag.a, drag.b)], span = view.slice(a, b + 1).map(p => p[F.id]);
    return drag.add ? new Set([...drag.base, ...span]) : new Set(span);
  }
  return new Set(selPids || []);
}

function tip(e, k) {
  const t = $("#tip");
  if (k < 0 || drag) { t.style.display = "none"; return; }
  const p = view[k], q = S.parts[p[F.part]], st = p[F.st];
  const where = st === "d" ? `done by <b>${esc(p[F.m])}</b> <span class="muted">(${esc(p[F.alloc])})</span>`
    : st === "h" ? `held by <b>${esc(p[F.m])}</b> <span class="muted">(${esc(p[F.alloc])})</span>` + (p[F.prog] >= 1 ? " · done here, not pushed yet" : p[F.prog] ? ` · ${Math.round(100 * p[F.prog])} % done here` : "")
    : st === "l" ? `<span style="color:var(--late)">past the deadline</span> of ${esc(p[F.alloc])}: free again` : "free";
  const lv = p[F.lv], rule = p[F.rule] === null ? "no rule" : `rule ${p[F.rule] + 1}`;
  const subs = Object.keys(SUB).filter(nm => SUB[nm].has(p[F.id]));
  t.innerHTML = `<b>${esc(q.prefix)}</b> #${p[F.id] - q.base} · P = <b>${esc(p[F.P])}</b> g<br>`
    + `${p[F.orders].map(esc).join(" ")} · ${kh(p[F.s])} kh on ${esc(S.ref)}<br>${where}<br>`
    + `<span class="lv ${lv}">${lv}</span> <span class="muted">${rule}</span>` + (subs.length ? ` · ↳ ${subs.map(esc).join(", ")}` : "")
    + (nextSet.has(p[F.id]) ? ` · <b>in the next claim of ${esc(P.nextm)}</b>` : "");
  t.style.display = "block";
  const b = $("#mapbox").getBoundingClientRect(); let x = e.clientX - b.left + 14, yy = e.clientY - b.top + 14;
  if (x + t.offsetWidth > b.width) x = e.clientX - b.left - t.offsetWidth - 10;
  t.style.left = x + "px"; t.style.top = yy + "px";
}

const WHAT = {now: "claimed at once by a watch, the jobs of its other allocations paused (nothing lost) until these are under way",
  high: "claimed at once by a watch, its other allocations ending without loss (uchikiri), these taking their kernels as they free",
  normal: "in the order of the campaign", low: "after the normal ones", skip: "never claimed"};
function selbar() {
  const box = $("#selbar"), ids = selPids ? new Set(selPids) : null, old = $("#subname");
  const keep = old ? [old.value, document.activeElement === old, old.selectionStart] : ["", false, 0];   // a name being typed outlives the reload every 30 s
  if (!ids || !ids.size) { box.style.display = "none"; return; }
  const q = S.pumps.filter(p => ids.has(p[F.id])), xs = q.map(p => p[F.x]), pre = [...new Set(q.map(p => S.parts[p[F.part]].prefix))];
  const lo = q.reduce((a, p) => p[F.x] < a[F.x] ? p : a), hi = q.reduce((a, p) => p[F.x] > a[F.x] ? p : a);
  const span = byG() && spanSel && !P.part.startsWith("@");
  const rule = span ? `${P.part ? P.part + ", " : ""}${lo[F.P]}–${hi[F.P]} g (and any pump that comes there later)` : `these ${q.length} pumps`;
  const nd = q.filter(p => p[F.st] === "d").length, nh = q.filter(p => p[F.st] === "h").length;
  const L = [...new Set(q.filter(p => p[F.st] !== "d").map(p => p[F.lv]))], lv0 = L.length === 1 ? L[0] : "normal";
  box.innerHTML = `<div class="row"><span class="num"><b>${q.length}</b> pumps · ${kh(q.reduce((a, p) => a + p[F.s], 0))} kh · ${Math.min(...xs).toFixed(3)}–${Math.max(...xs).toFixed(3)} g · ${pre.map(esc).join(", ")}</span>`
    + `<span class="muted">rule: ${esc(rule)}</span>`
    + S.levels.map(l => `<button class="lvb ${l}" data-l="${l}" title="${esc(WHAT[l] || "")}">${l}</button>`).join("") + `<button data-l="" title="drop the pieces picked (Esc)">✕</button></div>`
    + `<div class="row" style="margin-top:6px"><span class="ids num">${q.length <= 16 ? q.map(label).map(esc).join(", ") : ""}</span>`
    + (nd || nh ? `<span class="muted">${[nd && `${nd} done`, nh && `${nh} held`].filter(Boolean).join(", ")}: a priority acts on the pumps not done, those held as their allocation gives them back</span>` : "") + `</div>`
    + `<div class="row" style="margin-top:6px"><label class="muted">sub-campaign <input id="subname" maxlength="40" placeholder="its name (none: an AF tag)"></label>`
    + `<button id="mksub" title="these pumps as a sub-campaign of ${esc(S.campaign)}, listed with the parts, at the level they have (${lv0}); its priority is then set there">make a sub-campaign</button>`
    + `<span class="muted">a click picks a piece or drops it; a drag takes a span (Shift: added)</span></div>`;
  box.style.display = "block";
  for (const b of box.querySelectorAll("button[data-l]")) b.onclick = () => {
    if (!b.dataset.l) { selPids = null; draw(); selbar(); return; }
    const r = span ? Object.assign({level: b.dataset.l, g: [lo[F.P], hi[F.P]]}, P.part ? {part: P.part} : {}) : {level: b.dataset.l, pumps: q.map(p => p[F.id])};
    selPids = null; post("/prio", {op: "add", rule: r});
  };
  $("#mksub").onclick = () => { const nm = $("#subname").value.trim(); selPids = null; post("/prio", {op: "add", rule: {name: nm, level: lv0, pumps: q.map(p => p[F.id])}}); };
  $("#subname").onkeydown = e => { if (e.key === "Enter") $("#mksub").click(); e.stopPropagation(); };
  $("#subname").value = keep[0]; if (keep[1]) { $("#subname").focus(); $("#subname").setSelectionRange(keep[2], keep[2]); }
}
const byG = () => P.order === "g";

function legend() {
  const items = [];
  for (const m of S.machines) items.push(`<span><i style="background:${colour[m.name]}"></i>done by ${esc(m.name)}</span>`);
  for (const m of S.machines) items.push(`<span><i style="background:${colour[m.name]};opacity:${HA}"></i>held by ${esc(m.name)}</span>`);
  for (const m of S.machines) if (m.here) items.push(`<span><i style="background:${calc[m.name]}"></i>being computed on ${esc(m.name)}, as far as it has gone</span>`);
  items.push(`<span><i style="background:var(--free)"></i>free</span>`, `<span><i style="background:var(--free);border-bottom:3px solid var(--late)"></i>past the deadline</span>`,
    `<span><i style="border-top:5px solid var(--now);background:var(--free)"></i>now</span>`,
    `<span><i style="border-top:3px solid var(--hi);background:var(--free)"></i>high</span>`, `<span><i style="border-top:3px solid var(--lo);background:var(--free)"></i>low</span>`,
    `<span><i style="background:repeating-linear-gradient(135deg,var(--skip) 0 1.5px,transparent 1.5px 4px)"></i>skip</span>`,
    `<span><i style="outline:1.6px dashed var(--muted);outline-offset:-2px"></i>next claim</span>`, `<span>click pieces to pick them, or drag over a span, to give them a priority or make them a sub-campaign</span>`);
  $("#legend").innerHTML = items.join("");
}

// ------------------------------------------------------------------------------------------------------------------- the panels
function stats(A) {   // the done/held bar and counts of a set of pumps
  const s = f => A.filter(f).reduce((a, p) => a + p[F.s], 0), tot = s(() => true) || 1;
  const bar = S.machines.map(m => `<div style="width:${100 * s(p => p[F.st] === "d" && p[F.m] === m.name) / tot}%;background:${colour[m.name]}"></div>`).join("")
    + S.machines.map(m => `<div style="width:${100 * s(p => p[F.st] === "h" && p[F.m] === m.name) / tot}%;background:${colour[m.name]};opacity:${HA}"></div>`).join("");
  return {d: A.filter(p => p[F.st] === "d").length, h: A.filter(p => p[F.st] === "h").length, bar, left: s(p => p[F.st] !== "d")};
}
function parts() {
  const rowsH = S.parts.map((q, i) => {
    const A = S.pumps.filter(p => p[F.part] === i), s = f => A.filter(f).reduce((a, p) => a + p[F.s], 0), tot = s(() => true) || 1;
    const d = A.filter(p => p[F.st] === "d").length, h = A.filter(p => p[F.st] === "h").length;
    const L = new Set(A.filter(p => p[F.st] !== "d").map(p => p[F.lv])), lv = L.size === 1 ? [...L][0] : L.size ? "mixed" : "";
    const bar = S.machines.map(m => `<div style="width:${100 * s(p => p[F.st] === "d" && p[F.m] === m.name) / tot}%;background:${colour[m.name]}"></div>`).join("")
      + S.machines.map(m => `<div style="width:${100 * s(p => p[F.st] === "h" && p[F.m] === m.name) / tot}%;background:${colour[m.name]};opacity:${HA}"></div>`).join("");
    const opts = (lv === "mixed" ? `<option selected disabled>mixed</option>` : "") + S.levels.map(l => `<option${l === lv ? " selected" : ""}>${l}</option>`).join("");
    return `<tr class="part${q.prefix === P.part ? " on" : ""}" data-p="${esc(q.prefix)}"><td title="show this part alone">${esc(q.prefix)}</td>`
      + `<td><div class="about" title="${esc(q.about)}">${esc(q.about)}</div></td>`
      + `<td class="r num">${d}/${A.length}${h ? ` <span class="muted">+${h}</span>` : ""}</td><td><div class="pbar">${bar}</div></td>`
      + `<td class="r num">${khs(s(p => p[F.st] !== "d"))}</td>`
      + (lv ? `<td><select data-p="${esc(q.prefix)}">${opts}</select></td>` : `<td class="muted">done</td>`) + `</tr>`;
  });
  const subsH = S.rules.map((r, k) => [r, k]).filter(([r]) => r.name).map(([r, k]) => {   // the sub-campaigns, under the parts
    const A = S.pumps.filter(p => SUB[r.name].has(p[F.id])), t = stats(A), over = A.filter(p => p[F.st] !== "d" && p[F.rule] !== k).length;
    const about = `${A.length} pumps picked` + (A.length <= 6 ? `: ${A.map(label).join(", ")}` : "") + (over ? ` (${over} decided by a later rule)` : "") + ` · ${r.by || ""}`;
    return `<tr class="sub${"@" + r.name === P.part ? " on" : ""}" data-s="${esc(r.name)}"><td title="show this sub-campaign alone">${esc(r.name)}</td>`
      + `<td><div class="about" title="${esc(about)}">${esc(about)} ${r.t ? day(r.t) : ""}</div></td>`
      + `<td class="r num">${t.d}/${A.length}${t.h ? ` <span class="muted">+${t.h}</span>` : ""}</td><td><div class="pbar">${t.bar}</div></td>`
      + `<td class="r num">${khs(t.left)}</td>`
      + (t.d < A.length ? `<td><select data-s="${esc(r.name)}" title="${esc(WHAT[r.level] || "")}">${S.levels.map(l => `<option${l === r.level ? " selected" : ""}>${l}</option>`).join("")}</select></td>` : `<td class="muted">done</td>`) + `</tr>`;
  });
  $("#parts").innerHTML = `<tr><th>part</th><th>about</th><th class="r">done</th><th></th><th class="r">kh left</th><th>priority</th></tr>` + rowsH.join("") + subsH.join("");
  for (const tr of document.querySelectorAll("#parts tr.part")) tr.firstElementChild.onclick = () => { P.part = P.part === tr.dataset.p ? "" : tr.dataset.p; selPids = null; save(); build(); };
  for (const tr of document.querySelectorAll("#parts tr.sub")) tr.firstElementChild.onclick = () => { const v = "@" + tr.dataset.s; P.part = P.part === v ? "" : v; selPids = null; save(); build(); };
  for (const s of document.querySelectorAll("#parts select[data-p]")) s.onchange = () => post("/prio", {op: "add", rule: {level: s.value, part: s.dataset.p}});
  for (const s of document.querySelectorAll("#parts select[data-s]")) s.onchange = () => post("/prio", {op: "add", rule: {level: s.value, name: s.dataset.s}});
}

function rules() {
  const R = S.rules;
  if (!R.length) { $("#rules").innerHTML = `<div class="muted">No rule: every pump normal, the claims in the order of the campaign.</div>`; return; }
  $("#rules").innerHTML = R.map((r, i) => {
    const what = [r.name && `sub-campaign ${r.name}`, r.part, r.g && `${r.g[0]}–${r.g[1]} g`, r.pumps && `${r.pumps.length} pumps picked`].filter(Boolean).join(", ");
    return `<div class="rule"><span class="muted num">${i + 1}</span><span class="lv ${r.level}">${r.level}</span><span>${esc(what)}</span>`
      + `<span class="muted num">decides ${r.decides} · ${esc(r.by || "")} ${r.t ? day(r.t) : ""}</span><button class="x" data-i="${i}" title="drop this rule">✕</button></div>`;
  }).join("") + `<div class="row" style="margin-top:8px"><button id="clear">clear all</button></div>`;
  for (const b of document.querySelectorAll("#rules .x")) b.onclick = () => { const r = R[+b.dataset.i]; post("/prio", {op: "drop", t: r.t, by: r.by}); };
  const c = $("#clear");
  c.onclick = () => { if (c.dataset.sure) post("/prio", {op: "clear"}); else { c.dataset.sure = 1; c.textContent = "clear all: sure?"; setTimeout(() => { c.textContent = "clear all"; delete c.dataset.sure; }, 4000); } };
}

function machines() {
  $("#machines").innerHTML = S.machines.map(m => {
    const al = m.open.map(a => {
      const late = S.now > a.deadline;
      return `<div class="alloc num">${esc(a.id)}${a.prio ? `<span class="flag ${esc(a.prio)}" title="a claim of the kaizu's ${esc(a.prio)} pumps alone">${esc(a.prio)}</span>` : ""}`
        + `${a.uchikiri ? `<span class="flag" title="ends without loss: its pumps started complete, the others went back to the pool">uchikiri</span>` : ""}`
        + ` · ${a.done}/${a.n} · ${a.hours} h × ${a.kernels}${a.shinshu ? ` (shinshu ${esc(a.shinshu)})` : ""}${a.shugeki ? " (shugeki)" : ""}`
        + (a.paused ? ` · <b>${a.paused} jobs paused</b> for now` : "")
        + ` · ${kh(a.rest)} kh to go · deadline ${late ? `<span class="warn">${day(a.deadline)}, passed</span>` : day(a.deadline)}` + (a.delayed ? ` <span class="muted">(pushed back ${hm(a.delayed)} by now)</span>` : "")
        + (a.updated ? ` <span class="muted">· pushed ${ago(a.updated)}</span>` : "") + `</div>`;
    }).join("");
    const w = m.watch ? (m.watch.length ? ` · watch running (pid ${m.watch.join(", ")})` : ` · <span class="warn">no watch running</span>`) : "";
    const nx = m.next.pumps.length ? `next claim in ${m.next.hours} h: ${m.next.pumps.length} pumps, ${kh(m.next.cost)} kh` : "nothing free to claim";
    return `<div class="mach"><div><span class="sw" style="background:${colour[m.name]}"></span><b>${esc(m.name)}</b>${m.here ? " (this machine)" : ""}`
      + ` <span class="muted num">· ${m.kernels} kernels${m.gensoku ? ` (${esc(m.gensoku)})` : ""} · ${m.done} pumps done, ${m.kh.toFixed(1)} kh${w}</span></div>`
      + (m.open.length ? al + (m.end ? `<div class="alloc muted num">holds ${kh(m.rest)} kh, ends about ${day(m.end)}</div>` : "") : `<div class="alloc muted">holds nothing</div>`)
      + `<div class="alloc muted num">${nx}</div></div>`;
  }).join("");
}

// ------------------------------------------------------------------------------------------------------------------ interaction
const cv = $("#map");
cv.addEventListener("pointerdown", e => {
  const k = at(e); if (k < 0) { selPids = null; draw(); selbar(); return; }
  drag = {a: k, b: k, moved: false, add: e.shiftKey || e.ctrlKey || e.metaKey, base: new Set(selPids || [])}; cv.setPointerCapture(e.pointerId); tip(e, -1); draw();
});
cv.addEventListener("pointermove", e => {
  const k = at(e);
  if (drag) { if (k >= 0 && k !== drag.b) { drag.b = k; drag.moved = true; draw(); } return; }
  tip(e, k);
});
cv.addEventListener("pointerup", () => { if (!drag) return; const s = [...selected()]; spanSel = drag.moved && !drag.add; selPids = s.length ? s : null; drag = null; draw(); selbar(); });
cv.addEventListener("pointerleave", () => { if (!drag) $("#tip").style.display = "none"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { selPids = null; drag = null; draw(); selbar(); } });
for (const b of document.querySelectorAll("#order button")) b.onclick = () => { P.order = b.dataset.v; selPids = null; save(); build(); };
$("#rowh").onchange = e => { P.rowh = +e.target.value; save(); build(); };
$("#part").onchange = e => { P.part = e.target.value; selPids = null; save(); build(); };
$("#nextm").onchange = e => { P.nextm = e.target.value; save(); build(); };
$("#h").onchange = e => { const v = +e.target.value; if (v > 0) { P.h = v; save(); load(); } };
$("#camp").onchange = e => { P.c = e.target.value; P.part = ""; selPids = null; save(); load(); };
$("#sync").onclick = () => post("/sync", {});
$("#tassei").onclick = () => post("/tassei", {});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S && draw(), 120); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => S && build());
load(); setInterval(() => { if (!drag && !busy) load(); }, 30000);
</script>
</body>
</html>
